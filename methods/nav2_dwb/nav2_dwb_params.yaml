# The parameters of nav2_bringup's own example, with the four figures this robot
# asked for. Everything else is untouched.
#
# The two names the stack hardcodes are covered by tools/frames_alias.py, which
# declares ``base_link`` and ``base_footprint`` as identity links from
# RobotSNAP's ``chassis_link``: ``robot_base_frame: base_link`` below - and the
# C++ constants no parameter reaches - resolve to the real body. That part is
# the same as for every other method here.
#
# What the shipped example cannot do is finish a goal on this robot, and the four
# values marked "TUNED FOR ROBOTSNAP" are the whole of the difference:
#
#   yaw_goal_tolerance       The example makes a goal a *pose*: the robot has to
#                            arrive on its heading as well as at its point. A
#                            scenario gives its robot a point and no heading
#                            (``robot_1_goal: {x, y, z, yaw: null}``), so a
#                            heading requirement is an artefact of the driver
#                            and not of the mission. RobotSNAP's own arrival rule
#                            is positional and nothing else - see
#                            ``Robot.WatchManualArrival``: "Only the destination
#                            counts, never the velocity". A tighter figure than
#                            this left the robot parked 22 cm from the goal,
#                            turning on its heading with nothing to turn with,
#                            until the progress checker gave up and the goal
#                            came back ABORTED.
#
#   xy_goal_tolerance        Left at nav2's example figure of 0.25 m it also
#                            disagrees with the application: RobotSNAP counts a
#                            robot arrived within 0.2 m
#                            (``Robot.ArrivalDistanceMetres``), so a stack that
#                            stops at 0.25 m drives the robot to a point the
#                            episode then records as "not arrived". The two
#                            figures are the same now, and the goal the method
#                            completes is the goal the metrics read.
#   progress_checker.movement_time_allowance
#                            The stack aborts a goal that has not moved 0.5 m in
#                            ten seconds. The last of a skid-steer's turn in
#                            place is exactly that: a slow scrub that covers no
#                            ground. Twenty seconds lets a real final alignment
#                            run to its end instead of being read as a stuck
#                            robot.
#   min_speed_xy / min_speed_theta
#                            Read together by nav2's own validator: a trajectory
#                            slow in *both* translation and rotation is refused,
#                            so DWB stops sampling the 0.16 rad/s turns the
#                            chassis cannot execute and answers with a rate it
#                            can. min_speed_xy must be above zero for
#                            min_speed_theta to be read at all - with the example
#                            value of 0.0 the pair is inert.
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
